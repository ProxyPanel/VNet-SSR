name: ci

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go mod verify
      - run: go vet ./...
      - run: go test -timeout 120s ./...

  cross-build:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: make
      - uses: actions/upload-artifact@v4
        with:
          name: vnet-cross-build
          path: bin/*
          if-no-files-found: error

  release:
    # 打 tag 才发布：部署脚本取的是 releases/download/<TAG>/vnet-linux-<VDIS>.zip，
    # 只有 v2.1.0（2020 年的上游包）的话，新装节点装到的就不是这个仓的代码
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: make package VERSION="${GITHUB_REF_NAME}"
      - run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes dist/*.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vuln:
    runs-on: ubuntu-latest
    needs: check
    # 只报告，不阻断：待本机/镜像跟上新版 Go 之后再改成必需步骤
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
