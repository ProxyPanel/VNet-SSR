name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go mod verify
      - run: go vet ./...
      - run: go test -timeout 120s ./...

  cross-build:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: make
      - uses: actions/upload-artifact@v4
        with:
          name: vnet-cross-build
          path: bin/*
          if-no-files-found: error

  vuln:
    runs-on: ubuntu-latest
    needs: check
    # 只报告，不阻断：待本机/镜像跟上新版 Go 之后再改成必需步骤
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
